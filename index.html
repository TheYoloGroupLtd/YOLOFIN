<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YOLOFIN - Household Expense Tracker & Financial Calculators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

  <!-- MAIN APP CONTAINER -->
  <div class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-indigo-600 dark:bg-slate-900 shadow-md border-b border-indigo-700 dark:border-slate-800 transition-colors">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
          <div class="bg-white/10 p-2 rounded-lg text-white">
            <i class="fa-solid fa-wallet text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wide text-white">YOLOFIN</h1>
            <p class="text-xs text-indigo-200 dark:text-slate-400">Expense Tracker & Investment Suite</p>
          </div>
        </div>
        
        <div class="flex items-center gap-3">
          <nav class="flex gap-1 bg-indigo-700/60 dark:bg-slate-800 p-1 rounded-lg text-sm">
            <button id="nav-tracker" onclick="switchView('tracker')" class="px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 dark:bg-indigo-600 dark:text-white shadow">
              <i class="fa-solid fa-receipt mr-1"></i> Tracker
            </button>
            <button id="nav-calc" onclick="switchView('calculators')" class="px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white dark:text-slate-300 dark:hover:text-white">
              <i class="fa-solid fa-calculator mr-1"></i> Calculators
            </button>
          </nav>

          <!-- Dark/Light Mode Toggle -->
          <button onclick="toggleDarkMode()" class="p-2.5 rounded-lg bg-indigo-700/60 dark:bg-slate-800 text-indigo-100 dark:text-slate-300 hover:text-white transition" title="Toggle Theme">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

      <!-- VIEW 1: EXPENSE TRACKER -->
      <section id="content-tracker" class="space-y-6">
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Income</p>
            <p id="total-income" class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">₹0.00</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Expenses</p>
            <p id="total-expenses" class="text-2xl font-extrabold text-rose-600 dark:text-rose-400 mt-1">₹0.00</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Balance</p>
            <p id="net-balance" class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">₹0.00</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Add Transaction Form -->
          <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 h-fit">
            <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
              <i class="fa-solid fa-plus-circle text-indigo-600 dark:text-indigo-400"></i> Add Transaction
            </h2>
            <form id="tx-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
              <input type="hidden" id="tx-id" />
              
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Type</label>
                <div class="grid grid-cols-2 gap-2">
                  <label class="flex items-center justify-center p-2 border dark:border-slate-700 rounded-lg cursor-pointer text-sm font-medium has-[:checked]:bg-emerald-50 dark:has-[:checked]:bg-emerald-950/40 has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-700 dark:has-[:checked]:text-emerald-400">
                    <input type="radio" name="tx-type" value="income" class="sr-only" checked /> Income
                  </label>
                  <label class="flex items-center justify-center p-2 border dark:border-slate-700 rounded-lg cursor-pointer text-sm font-medium has-[:checked]:bg-rose-50 dark:has-[:checked]:bg-rose-950/40 has-[:checked]:border-rose-500 has-[:checked]:text-rose-700 dark:has-[:checked]:text-rose-400">
                    <input type="radio" name="tx-type" value="expense" class="sr-only" /> Expense
                  </label>
                </div>
              </div>

              <div>
                <label for="tx-desc" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Description</label>
                <input type="text" id="tx-desc" required placeholder="e.g. Salary, Rent, Grocery" class="w-full px-3 py-2 border dark:border-slate-700 rounded-lg bg-transparent dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
              </div>

              <div>
                <label for="tx-amount" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Amount (₹)</label>
                <input type="number" id="tx-amount" min="0.01" step="0.01" required placeholder="0.00" class="w-full px-3 py-2 border dark:border-slate-700 rounded-lg bg-transparent dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
              </div>

              <div>
                <label for="tx-category" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Category</label>
                <select id="tx-category" class="w-full px-3 py-2 border dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white dark:bg-slate-800 dark:text-white">
                  <option value="Salary">Salary</option>
                  <option value="Investment">Investment</option>
                  <option value="Housing">Housing & Rent</option>
                  <option value="Food">Groceries & Food</option>
                  <option value="Utilities">Utilities & Bills</option>
                  <option value="Transport">Transport & Fuel</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div>
                <label for="tx-date" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Date</label>
                <input type="date" id="tx-date" required class="w-full px-3 py-2 border dark:border-slate-700 rounded-lg bg-transparent dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
              </div>

              <div class="flex gap-2">
                <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium transition text-sm">Save Transaction</button>
                <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden px-3 py-2 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg text-sm hover:bg-slate-300 dark:hover:bg-slate-700">Cancel</button>
              </div>
            </form>
          </div>

          <!-- Transactions List & Charts -->
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
              <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-4">Expense Breakdown</h2>
              <div class="h-64 flex justify-center items-center">
                <canvas id="expense-chart"></canvas>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
              <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                <h2 class="text-lg font-bold text-slate-800 dark:text-white">Recent Transactions</h2>
                <div>
                  <select id="filter-category" onchange="renderTracker()" class="text-xs px-3 py-2 border dark:border-slate-700 rounded-md bg-white dark:bg-slate-800 dark:text-white">
                    <option value="ALL">All Categories</option>
                    <option value="Salary">Salary</option>
                    <option value="Investment">Investment</option>
                    <option value="Housing">Housing</option>
                    <option value="Food">Food</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr class="border-b dark:border-slate-800 text-slate-400 font-semibold text-xs">
                      <th class="py-2">Date</th>
                      <th class="py-2">Description</th>
                      <th class="py-2">Category</th>
                      <th class="py-2 text-right">Amount</th>
                      <th class="py-2 text-center">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="tx-table-body" class="divide-y divide-slate-100 dark:divide-slate-800">
                    <!-- Dynamic rows -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- VIEW 2: CALCULATORS -->
      <section id="content-calculators" class="hidden space-y-6">
        <!-- Sub-Tabs -->
        <div class="flex overflow-x-auto gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
          <button onclick="setCalcTab('sip')" class="calc-tab-btn active px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-400">SIP Calculator</button>
          <button onclick="setCalcTab('lumpsum')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">Lumpsum Calculator</button>
          <button onclick="setCalcTab('swp')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">SWP Calculator</button>
          <button onclick="setCalcTab('stp')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">STP Calculator</button>
          <button onclick="setCalcTab('stepup')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">Step-Up SIP</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Controls Panel -->
          <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4" id="calc-inputs">
            <!-- Dynamic Controls -->
          </div>

          <!-- Output & Chart Panel -->
          <div class="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
              <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-800">
                <p class="text-xs font-medium text-slate-500 dark:text-slate-400" id="res-label-1">Invested Amount</p>
                <p class="text-xl font-bold text-slate-800 dark:text-white mt-1" id="res-val-1">₹0</p>
              </div>
              <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-800">
                <p class="text-xs font-medium text-slate-500 dark:text-slate-400" id="res-label-2">Est. Returns</p>
                <p class="text-xl font-bold text-emerald-600 dark:text-emerald-400 mt-1" id="res-val-2">₹0</p>
              </div>
              <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-800">
                <p class="text-xs font-medium text-slate-500 dark:text-slate-400" id="res-label-3">Total Future Value</p>
                <p class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mt-1" id="res-val-3">₹0</p>
              </div>
            </div>

            <div class="h-64 w-full flex justify-center items-center">
              <canvas id="calc-chart"></canvas>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    let expenseChartInstance = null;
    let calcChartInstance = null;
    let activeCalc = 'sip';
    let transactions = JSON.parse(localStorage.getItem('yolofin_transactions')) || [
      { id: '1', type: 'income', desc: 'Monthly Salary', amount: 85000, category: 'Salary', date: '2026-11-01' },
      { id: '2', type: 'expense', desc: 'House Rent', amount: 25000, category: 'Housing', date: '2026-11-02' },
      { id: '3', type: 'expense', desc: 'Groceries & Supplies', amount: 8500, category: 'Food', date: '2026-11-04' }
    ];

    document.getElementById('tx-date').valueAsDate = new Date();
    renderTracker();

    // --- DARK MODE LOGIC ---
    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        icon.className = "fa-solid fa-moon";
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        icon.className = "fa-solid fa-sun";
      }
      renderTracker();
      if (!document.getElementById('content-calculators').classList.contains('hidden')) calculateResults();
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('theme-icon').className = "fa-solid fa-sun";
    }

    // --- NAVIGATION ---
    function switchView(view) {
      document.getElementById('content-tracker').classList.toggle('hidden', view !== 'tracker');
      document.getElementById('content-calculators').classList.toggle('hidden', view !== 'calculators');
      
      const trackerBtn = document.getElementById('nav-tracker');
      const calcBtn = document.getElementById('nav-calc');

      if (view === 'tracker') {
        trackerBtn.className = "px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 dark:bg-indigo-600 dark:text-white shadow";
        calcBtn.className = "px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white dark:text-slate-300 dark:hover:text-white";
        renderTracker();
      } else {
        calcBtn.className = "px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 dark:bg-indigo-600 dark:text-white shadow";
        trackerBtn.className = "px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white dark:text-slate-300 dark:hover:text-white";
        renderCalcInputs();
      }
    }

    // --- TRACKER LOGIC ---
    function saveTransactions() {
      localStorage.setItem('yolofin_transactions', JSON.stringify(transactions));
      renderTracker();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('tx-id').value;
      const type = document.querySelector('input[name="tx-type"]:checked').value;
      const desc = document.getElementById('tx-desc').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const category = document.getElementById('tx-category').value;
      const date = document.getElementById('tx-date').value;

      if (id) {
        const index = transactions.findIndex(t => t.id === id);
        if (index !== -1) transactions[index] = { id, type, desc, amount, category, date };
      } else {
        transactions.push({ id: Date.now().toString(), type, desc, amount, category, date });
      }

      resetForm();
      saveTransactions();
    }

    function resetForm() {
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-form').reset();
      document.getElementById('tx-date').valueAsDate = new Date();
      document.getElementById('btn-save').innerText = 'Save Transaction';
      document.getElementById('btn-cancel').classList.add('hidden');
    }

    function editTx(id) {
      const tx = transactions.find(t => t.id === id);
      if (!tx) return;
      document.getElementById('tx-id').value = tx.id;
      document.querySelector(`input[name="tx-type"][value="${tx.type}"]`).checked = true;
      document.getElementById('tx-desc').value = tx.desc;
      document.getElementById('tx-amount').value = tx.amount;
      document.getElementById('tx-category').value = tx.category;
      document.getElementById('tx-date').value = tx.date;
      document.getElementById('btn-save').innerText = 'Update Transaction';
      document.getElementById('btn-cancel').classList.remove('hidden');
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveTransactions();
    }

    function renderTracker() {
      const catFilter = document.getElementById('filter-category').value;
      const filtered = transactions.filter(t => catFilter === 'ALL' || t.category === catFilter);

      let income = 0, expense = 0;
      const categoryTotals = {};

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else {
          expense += t.amount;
          categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
        }
      });

      document.getElementById('total-income').innerText = `₹${income.toLocaleString('en-IN')}`;
      document.getElementById('total-expenses').innerText = `₹${expense.toLocaleString('en-IN')}`;
      document.getElementById('net-balance').innerText = `₹${(income - expense).toLocaleString('en-IN')}`;

      // Table Render
      const tbody = document.getElementById('tx-table-body');
      tbody.innerHTML = filtered.length ? '' : '<tr><td colspan="5" class="text-center py-4 text-slate-400">No transactions recorded</td></tr>';
      
      filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 dark:hover:bg-slate-800/50 transition";
        tr.innerHTML = `
          <td class="py-2.5 text-xs text-slate-500 dark:text-slate-400">${t.date}</td>
          <td class="py-2.5 font-medium text-slate-700 dark:text-slate-200">${t.desc}</td>
          <td class="py-2.5"><span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${t.category}</span></td>
          <td class="py-2.5 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
            ${t.type === 'income' ? '+' : '-'}₹${t.amount.toLocaleString('en-IN')}
          </td>
          <td class="py-2.5 text-center">
            <button onclick="editTx('${t.id}')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 mr-2"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteTx('${t.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Chart Render
      const isDark = document.documentElement.classList.contains('dark');
      const ctx = document.getElementById('expense-chart').getContext('2d');
      if (expenseChartInstance) expenseChartInstance.destroy();

      expenseChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categoryTotals),
          datasets: [{
            data: Object.values(categoryTotals),
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#64748b'],
            borderWidth: isDark ? 0 : 2
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: isDark ? '#cbd5e1' : '#334155' } }
          }
        }
      });
    }

    // --- CALCULATOR LOGIC ---
    function setCalcTab(tab) {
      activeCalc = tab;
      document.querySelectorAll('.calc-tab-btn').forEach(btn => {
        btn.className = "calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800";
      });
      event.target.className = "calc-tab-btn active px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-400";
      renderCalcInputs();
    }

    function renderCalcInputs() {
      const container = document.getElementById('calc-inputs');
      if (activeCalc === 'sip') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-2">SIP Calculator</h2>
          ${sliderInput('Monthly Investment (₹)', 'sip-amount', 500, 100000, 5000, 500)}
          ${sliderInput('Expected Return Rate (p.a %)', 'sip-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Time Period (Years)', 'sip-years', 1, 40, 10, 1)}
        `;
      } else if (activeCalc === 'lumpsum') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-2">Lumpsum Calculator</h2>
          ${sliderInput('Total Investment (₹)', 'lump-amount', 1000, 1000000, 100000, 5000)}
          ${sliderInput('Expected Return Rate (p.a %)', 'lump-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Time Period (Years)', 'lump-years', 1, 40, 10, 1)}
        `;
      } else if (activeCalc === 'swp') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-2">SWP Calculator</h2>
          ${sliderInput('Total Corpus (₹)', 'swp-corpus', 100000, 10000000, 1000000, 50000)}
          ${sliderInput('Monthly Withdrawal (₹)', 'swp-draw', 1000, 100000, 10000, 1000)}
          ${sliderInput('Expected Return Rate (p.a %)', 'swp-rate', 1, 30, 8, 0.5)}
          ${sliderInput('Time Period (Years)', 'swp-years', 1, 30, 10, 1)}
        `;
      } else if (activeCalc === 'stp') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-2">STP Calculator</h2>
          ${sliderInput('Initial Transferring Corpus (₹)', 'stp-corpus', 50000, 5000000, 500000, 25000)}
          ${sliderInput('Monthly Transfer Amount (₹)', 'stp-transfer', 1000, 100000, 10000, 1000)}
          ${sliderInput('Transferor Fund Return (% p.a)', 'stp-source-rate', 1, 15, 6, 0.5)}
          ${sliderInput('Destination Fund Return (% p.a)', 'stp-dest-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Duration (Years)', 'stp-years', 1, 30, 5, 1)}
        `;
      } else if (activeCalc === 'stepup') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-2">Step-Up SIP Calculator</h2>
          ${sliderInput('Initial Monthly SIP (₹)', 'step-amount', 500, 100000, 5000, 500)}
          ${sliderInput('Annual Step-Up (%)', 'step-percent', 1, 50, 10, 1)}
          ${sliderInput('Expected Return Rate (p.a %)', 'step-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Time Period (Years)', 'step-years', 1, 40, 10, 1)}
        `;
      }
      calculateResults();
    }

    function sliderInput(label, id, min, max, value, step) {
      return `
        <div class="space-y-1">
          <div class="flex justify-between text-xs font-semibold text-slate-600 dark:text-slate-400">
            <span>${label}</span>
            <span id="${id}-val" class="text-indigo-600 dark:text-indigo-400">${value}</span>
          </div>
          <input type="range" id="${id}" min="${min}" max="${max}" value="${value}" step="${step}" 
            oninput="document.getElementById('${id}-val').innerText = parseFloat(this.value).toLocaleString('en-IN'); calculateResults();" 
            class="w-full accent-indigo-600 cursor-pointer" />
        </div>
      `;
    }

    function calculateResults() {
      let invested = 0, returns = 0, total = 0;

      if (activeCalc === 'sip') {
        const P = parseFloat(document.getElementById('sip-amount').value);
        const i = parseFloat(document.getElementById('sip-rate').value) / 12 / 100;
        const n = parseFloat(document.getElementById('sip-years').value) * 12;

        total = P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i);
        invested = P * n;
        returns = total - invested;

      } else if (activeCalc === 'lumpsum') {
        const P = parseFloat(document.getElementById('lump-amount').value);
        const r = parseFloat(document.getElementById('lump-rate').value) / 100;
        const n = parseFloat(document.getElementById('lump-years').value);

        total = P * Math.pow(1 + r, n);
        invested = P;
        returns = total - invested;

      } else if (activeCalc === 'swp') {
        let corpus = parseFloat(document.getElementById('swp-corpus').value);
        const draw = parseFloat(document.getElementById('swp-draw').value);
        const r = parseFloat(document.getElementById('swp-rate').value) / 12 / 100;
        const months = parseFloat(document.getElementById('swp-years').value) * 12;

        let totalWithdrawn = 0;
        for (let m = 0; m < months; m++) {
          corpus = (corpus - draw) * (1 + r);
          totalWithdrawn += draw;
          if (corpus <= 0) { corpus = 0; break; }
        }

        invested = parseFloat(document.getElementById('swp-corpus').value);
        returns = totalWithdrawn;
        total = corpus + totalWithdrawn;

      } else if (activeCalc === 'stp') {
        let sourceCorpus = parseFloat(document.getElementById('stp-corpus').value);
        const transfer = parseFloat(document.getElementById('stp-transfer').value);
        const rSource = parseFloat(document.getElementById('stp-source-rate').value) / 12 / 100;
        const rDest = parseFloat(document.getElementById('stp-dest-rate').value) / 12 / 100;
        const months = parseFloat(document.getElementById('stp-years').value) * 12;

        let destCorpus = 0;
        for (let m = 0; m < months; m++) {
          if (sourceCorpus >= transfer) {
            sourceCorpus -= transfer;
            destCorpus = (destCorpus + transfer) * (1 + rDest);
          } else {
            destCorpus = (destCorpus + sourceCorpus) * (1 + rDest);
            sourceCorpus = 0;
          }
          sourceCorpus *= (1 + rSource);
        }

        invested = parseFloat(document.getElementById('stp-corpus').value);
        total = sourceCorpus + destCorpus;
        returns = total - invested;

      } else if (activeCalc === 'stepup') {
        let P = parseFloat(document.getElementById('step-amount').value);
        const step = parseFloat(document.getElementById('step-percent').value) / 100;
        const r = parseFloat(document.getElementById('step-rate').value) / 12 / 100;
        const years = parseFloat(document.getElementById('step-years').value);

        total = 0;
        invested = 0;

        for (let y = 0; y < years; y++) {
          for (let m = 0; m < 12; m++) {
            total = (total + P) * (1 + r);
            invested += P;
          }
          P *= (1 + step);
        }
        returns = total - invested;
      }

      document.getElementById('res-label-1').innerText = activeCalc === 'swp' ? 'Initial Corpus' : 'Invested Amount';
      document.getElementById('res-label-2').innerText = activeCalc === 'swp' ? 'Total Withdrawn' : 'Est. Returns';
      document.getElementById('res-label-3').innerText = activeCalc === 'swp' ? 'Final Balance' : 'Total Future Value';

      document.getElementById('res-val-1').innerText = `₹${Math.round(invested).toLocaleString('en-IN')}`;
      document.getElementById('res-val-2').innerText = `₹${Math.round(returns).toLocaleString('en-IN')}`;
      document.getElementById('res-val-3').innerText = `₹${Math.round(activeCalc === 'swp' ? (total - returns) : total).toLocaleString('en-IN')}`;

      // Update Pie Chart
      const isDark = document.documentElement.classList.contains('dark');
      const ctx = document.getElementById('calc-chart').getContext('2d');
      if (calcChartInstance) calcChartInstance.destroy();

      calcChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: [document.getElementById('res-label-1').innerText, document.getElementById('res-label-2').innerText],
          datasets: [{
            data: [Math.round(invested), Math.round(returns)],
            backgroundColor: ['#6366f1', '#10b981'],
            borderWidth: isDark ? 0 : 2
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: isDark ? '#cbd5e1' : '#334155' } }
          }
        }
      });
    }
  </script>
</body>
</html>
