<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Household Expense Tracker & Financial Calculators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">FinanceHub</h1>
      </div>
      <nav class="flex gap-2 bg-indigo-700/60 p-1 rounded-lg text-sm">
        <button id="nav-tracker" onclick="switchView('tracker')" class="px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 shadow">
          <i class="fa-solid fa-receipt mr-1"></i> Expense Tracker
        </button>
        <button id="nav-calc" onclick="switchView('calculators')" class="px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white">
          <i class="fa-solid fa-calculator mr-1"></i> Investment Calculators
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- VIEW 1: EXPENSE TRACKER -->
    <section id="view-tracker" class="space-y-6">
      <!-- Summary Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Income</p>
          <p id="total-income" class="text-2xl font-extrabold text-emerald-600 mt-1">₹0.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Expenses</p>
          <p id="total-expenses" class="text-2xl font-extrabold text-rose-600 mt-1">₹0.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Balance</p>
          <p id="net-balance" class="text-2xl font-extrabold text-indigo-600 mt-1">₹0.00</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Add Transaction Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
          <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-plus-circle text-indigo-600"></i> Add Transaction
          </h2>
          <form id="tx-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <input type="hidden" id="tx-id" />
            
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Type</label>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer text-sm font-medium has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-700">
                  <input type="radio" name="tx-type" value="income" class="sr-only" checked /> Income
                </label>
                <label class="flex items-center justify-center p-2 border rounded-lg cursor-pointer text-sm font-medium has-[:checked]:bg-rose-50 has-[:checked]:border-rose-500 has-[:checked]:text-rose-700">
                  <input type="radio" name="tx-type" value="expense" class="sr-only" /> Expense
                </label>
              </div>
            </div>

            <div>
              <label for="tx-desc" class="block text-xs font-semibold text-slate-600 mb-1">Description</label>
              <input type="text" id="tx-desc" required placeholder="e.g. Salary, Rent, Grocery" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
            </div>

            <div>
              <label for="tx-amount" class="block text-xs font-semibold text-slate-600 mb-1">Amount (₹)</label>
              <input type="number" id="tx-amount" min="0.01" step="0.01" required placeholder="0.00" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
            </div>

            <div>
              <label for="tx-category" class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
              <select id="tx-category" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                <option value="Salary">Salary</option>
                <option value="Investment">Investment</option>
                <option value="Housing">Housing & Rent</option>
                <option value="Food">Groceries & Food</option>
                <option value="Utilities">Utilities & Bills</option>
                <option value="Transport">Transport & Fuel</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label for="tx-date" class="block text-xs font-semibold text-slate-600 mb-1">Date</label>
              <input type="date" id="tx-date" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
            </div>

            <div class="flex gap-2">
              <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition text-sm">Save Transaction</button>
              <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden px-3 py-2 bg-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-300">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Transactions List & Charts -->
        <div class="lg:col-span-2 space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Expense Breakdown</h2>
            <div class="h-64 flex justify-center items-center">
              <canvas id="expense-chart"></canvas>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
              <h2 class="text-lg font-bold text-slate-800">Recent Transactions</h2>
              <div class="flex gap-2">
                <select id="filter-category" onchange="renderTracker()" class="text-xs px-2 py-1.5 border rounded-md bg-white">
                  <option value="ALL">All Categories</option>
                  <option value="Salary">Salary</option>
                  <option value="Investment">Investment</option>
                  <option value="Housing">Housing</option>
                  <option value="Food">Food</option>
                  <option value="Utilities">Utilities</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="border-b text-slate-400 font-semibold text-xs">
                    <th class="py-2">Date</th>
                    <th class="py-2">Description</th>
                    <th class="py-2">Category</th>
                    <th class="py-2 text-right">Amount</th>
                    <th class="py-2 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody id="tx-table-body" class="divide-y divide-slate-100">
                  <!-- Dynamic rows go here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- VIEW 2: CALCULATORS -->
    <section id="view-calculators" class="hidden space-y-6">
      <!-- Sub-Tabs -->
      <div class="flex overflow-x-auto gap-2 border-b border-slate-200 pb-2">
        <button onclick="setCalcTab('sip')" class="calc-tab-btn active px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-indigo-50 text-indigo-700">SIP Calculator</button>
        <button onclick="setCalcTab('lumpsum')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 hover:bg-slate-100">Lumpsum Calculator</button>
        <button onclick="setCalcTab('swp')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 hover:bg-slate-100">SWP Calculator</button>
        <button onclick="setCalcTab('stp')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 hover:bg-slate-100">STP Calculator</button>
        <button onclick="setCalcTab('stepup')" class="calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 hover:bg-slate-100">Step-Up SIP</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Controls Panel -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4" id="calc-inputs">
          <!-- Dynamic Controls Rendered via JS -->
        </div>

        <!-- Output & Chart Panel -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
              <p class="text-xs font-medium text-slate-500" id="res-label-1">Invested Amount</p>
              <p class="text-xl font-bold text-slate-800 mt-1" id="res-val-1">₹0</p>
            </div>
            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
              <p class="text-xs font-medium text-slate-500" id="res-label-2">Est. Returns</p>
              <p class="text-xl font-bold text-emerald-600 mt-1" id="res-val-2">₹0</p>
            </div>
            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
              <p class="text-xs font-medium text-slate-500" id="res-label-3">Total Future Value</p>
              <p class="text-xl font-bold text-indigo-600 mt-1" id="res-val-3">₹0</p>
            </div>
          </div>

          <div class="h-64 w-full flex justify-center items-center">
            <canvas id="calc-chart"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- STATE MANAGEMENT ---
    let transactions = JSON.parse(localStorage.getItem('hh_transactions')) || [
      { id: '1', type: 'income', desc: 'Monthly Salary', amount: 85000, category: 'Salary', date: '2026-11-01' },
      { id: '2', type: 'expense', desc: 'House Rent', amount: 25000, category: 'Housing', date: '2026-11-02' },
      { id: '3', type: 'expense', desc: 'Groceries', amount: 8500, category: 'Food', date: '2026-11-04' }
    ];

    let expenseChartInstance = null;
    let calcChartInstance = null;
    let activeCalc = 'sip';

    document.getElementById('tx-date').valueAsDate = new Date();

    // --- NAVIGATION ---
    function switchView(view) {
      document.getElementById('view-tracker').classList.toggle('hidden', view !== 'tracker');
      document.getElementById('view-calculators').classList.toggle('hidden', view !== 'calculators');
      
      const trackerBtn = document.getElementById('nav-tracker');
      const calcBtn = document.getElementById('nav-calc');

      if (view === 'tracker') {
        trackerBtn.className = "px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 shadow";
        calcBtn.className = "px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white";
        renderTracker();
      } else {
        calcBtn.className = "px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 shadow";
        trackerBtn.className = "px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white";
        renderCalcInputs();
      }
    }

    // --- TRACKER LOGIC ---
    function saveTransactions() {
      localStorage.setItem('hh_transactions', JSON.stringify(transactions));
      renderTracker();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('tx-id').value;
      const type = document.querySelector('input[name="tx-type"]:checked').value;
      const desc = document.getElementById('tx-desc').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const category = document.getElementById('tx-category').value;
      const date = document.getElementById('tx-date').value;

      if (id) {
        const index = transactions.findIndex(t => t.id === id);
        if (index !== -1) transactions[index] = { id, type, desc, amount, category, date };
      } else {
        transactions.push({ id: Date.now().toString(), type, desc, amount, category, date });
      }

      resetForm();
      saveTransactions();
    }

    function resetForm() {
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-form').reset();
      document.getElementById('tx-date').valueAsDate = new Date();
      document.getElementById('btn-save').innerText = 'Save Transaction';
      document.getElementById('btn-cancel').classList.add('hidden');
    }

    function editTx(id) {
      const tx = transactions.find(t => t.id === id);
      if (!tx) return;
      document.getElementById('tx-id').value = tx.id;
      document.querySelector(`input[name="tx-type"][value="${tx.type}"]`).checked = true;
      document.getElementById('tx-desc').value = tx.desc;
      document.getElementById('tx-amount').value = tx.amount;
      document.getElementById('tx-category').value = tx.category;
      document.getElementById('tx-date').value = tx.date;
      document.getElementById('btn-save').innerText = 'Update Transaction';
      document.getElementById('btn-cancel').classList.remove('hidden');
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveTransactions();
    }

    function renderTracker() {
      const catFilter = document.getElementById('filter-category').value;
      const filtered = transactions.filter(t => catFilter === 'ALL' || t.category === catFilter);

      let income = 0, expense = 0;
      const categoryTotals = {};

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else {
          expense += t.amount;
          categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
        }
      });

      document.getElementById('total-income').innerText = `₹${income.toLocaleString('en-IN')}`;
      document.getElementById('total-expenses').innerText = `₹${expense.toLocaleString('en-IN')}`;
      document.getElementById('net-balance').innerText = `₹${(income - expense).toLocaleString('en-IN')}`;

      // Table Render
      const tbody = document.getElementById('tx-table-body');
      tbody.innerHTML = filtered.length ? '' : '<tr><td colspan="5" class="text-center py-4 text-slate-400">No transactions recorded</td></tr>';
      
      filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="py-2.5 text-xs text-slate-500">${t.date}</td>
          <td class="py-2.5 font-medium text-slate-700">${t.desc}</td>
          <td class="py-2.5"><span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">${t.category}</span></td>
          <td class="py-2.5 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
            ${t.type === 'income' ? '+' : '-'}₹${t.amount.toLocaleString('en-IN')}
          </td>
          <td class="py-2.5 text-center">
            <button onclick="editTx('${t.id}')" class="text-indigo-600 hover:text-indigo-800 mr-2"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteTx('${t.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Chart Render
      const ctx = document.getElementById('expense-chart').getContext('2d');
      if (expenseChartInstance) expenseChartInstance.destroy();

      expenseChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categoryTotals),
          datasets: [{
            data: Object.values(categoryTotals),
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#64748b']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // --- CALCULATOR LOGIC ---
    function setCalcTab(tab) {
      activeCalc = tab;
      document.querySelectorAll('.calc-tab-btn').forEach(btn => {
        btn.className = "calc-tab-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap text-slate-600 hover:bg-slate-100";
      });
      event.target.className = "calc-tab-btn active px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-indigo-50 text-indigo-700";
      renderCalcInputs();
    }

    function renderCalcInputs() {
      const container = document.getElementById('calc-inputs');
      if (activeCalc === 'sip') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 mb-2">SIP Calculator</h2>
          ${sliderInput('Monthly Investment (₹)', 'sip-amount', 500, 100000, 5000, 500)}
          ${sliderInput('Expected Return Rate (p.a %)', 'sip-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Time Period (Years)', 'sip-years', 1, 40, 10, 1)}
        `;
      } else if (activeCalc === 'lumpsum') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 mb-2">Lumpsum Calculator</h2>
          ${sliderInput('Total Investment (₹)', 'lump-amount', 1000, 1000000, 100000, 5000)}
          ${sliderInput('Expected Return Rate (p.a %)', 'lump-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Time Period (Years)', 'lump-years', 1, 40, 10, 1)}
        `;
      } else if (activeCalc === 'swp') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 mb-2">SWP Calculator</h2>
          ${sliderInput('Total Corpus (₹)', 'swp-corpus', 100000, 10000000, 1000000, 50000)}
          ${sliderInput('Monthly Withdrawal (₹)', 'swp-draw', 1000, 100000, 10000, 1000)}
          ${sliderInput('Expected Return Rate (p.a %)', 'swp-rate', 1, 30, 8, 0.5)}
          ${sliderInput('Time Period (Years)', 'swp-years', 1, 30, 10, 1)}
        `;
      } else if (activeCalc === 'stp') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 mb-2">STP Calculator</h2>
          ${sliderInput('Initial Transferring Corpus (₹)', 'stp-corpus', 50000, 5000000, 500000, 25000)}
          ${sliderInput('Monthly Transfer Amount (₹)', 'stp-transfer', 1000, 100000, 10000, 1000)}
          ${sliderInput('Transferor Fund Return (% p.a)', 'stp-source-rate', 1, 15, 6, 0.5)}
          ${sliderInput('Destination Fund Return (% p.a)', 'stp-dest-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Duration (Years)', 'stp-years', 1, 30, 5, 1)}
        `;
      } else if (activeCalc === 'stepup') {
        container.innerHTML = `
          <h2 class="text-lg font-bold text-slate-800 mb-2">Step-Up SIP Calculator</h2>
          ${sliderInput('Initial Monthly SIP (₹)', 'step-amount', 500, 100000, 5000, 500)}
          ${sliderInput('Annual Step-Up (%)', 'step-percent', 1, 50, 10, 1)}
          ${sliderInput('Expected Return Rate (p.a %)', 'step-rate', 1, 30, 12, 0.5)}
          ${sliderInput('Time Period (Years)', 'step-years', 1, 40, 10, 1)}
        `;
      }
      calculateResults();
    }

    function sliderInput(label, id, min, max, value, step) {
      return `
        <div class="space-y-1">
          <div class="flex justify-between text-xs font-semibold text-slate-600">
            <span>${label}</span>
            <span id="${id}-val" class="text-indigo-600">${value}</span>
          </div>
          <input type="range" id="${id}" min="${min}" max="${max}" value="${value}" step="${step}" 
            oninput="document.getElementById('${id}-val').innerText = parseFloat(this.value).toLocaleString('en-IN'); calculateResults();" 
            class="w-full accent-indigo-600 cursor-pointer" />
        </div>
      `;
    }

    function calculateResults() {
      let invested = 0, returns = 0, total = 0;

      if (activeCalc === 'sip') {
        const P = parseFloat(document.getElementById('sip-amount').value);
        const i = parseFloat(document.getElementById('sip-rate').value) / 12 / 100;
        const n = parseFloat(document.getElementById('sip-years').value) * 12;

        total = P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i);
        invested = P * n;
        returns = total - invested;

      } else if (activeCalc === 'lumpsum') {
        const P = parseFloat(document.getElementById('lump-amount').value);
        const r = parseFloat(document.getElementById('lump-rate').value) / 100;
        const n = parseFloat(document.getElementById('lump-years').value);

        total = P * Math.pow(1 + r, n);
        invested = P;
        returns = total - invested;

      } else if (activeCalc === 'swp') {
        let corpus = parseFloat(document.getElementById('swp-corpus').value);
        const draw = parseFloat(document.getElementById('swp-draw').value);
        const r = parseFloat(document.getElementById('swp-rate').value) / 12 / 100;
        const months = parseFloat(document.getElementById('swp-years').value) * 12;

        let totalWithdrawn = 0;
        for (let m = 0; m < months; m++) {
          corpus = (corpus - draw) * (1 + r);
          totalWithdrawn += draw;
          if (corpus <= 0) { corpus = 0; break; }
        }

        invested = parseFloat(document.getElementById('swp-corpus').value);
        returns = totalWithdrawn;
        total = corpus + totalWithdrawn;

      } else if (activeCalc === 'stp') {
        let sourceCorpus = parseFloat(document.getElementById('stp-corpus').value);
        const transfer = parseFloat(document.getElementById('stp-transfer').value);
        const rSource = parseFloat(document.getElementById('stp-source-rate').value) / 12 / 100;
        const rDest = parseFloat(document.getElementById('stp-dest-rate').value) / 12 / 100;
        const months = parseFloat(document.getElementById('stp-years').value) * 12;

        let destCorpus = 0;
        for (let m = 0; m < months; m++) {
          if (sourceCorpus >= transfer) {
            sourceCorpus -= transfer;
            destCorpus = (destCorpus + transfer) * (1 + rDest);
          } else {
            destCorpus = (destCorpus + sourceCorpus) * (1 + rDest);
            sourceCorpus = 0;
          }
          sourceCorpus *= (1 + rSource);
        }

        invested = parseFloat(document.getElementById('stp-corpus').value);
        total = sourceCorpus + destCorpus;
        returns = total - invested;

      } else if (activeCalc === 'stepup') {
        let P = parseFloat(document.getElementById('step-amount').value);
        const step = parseFloat(document.getElementById('step-percent').value) / 100;
        const r = parseFloat(document.getElementById('step-rate').value) / 12 / 100;
        const years = parseFloat(document.getElementById('step-years').value);

        total = 0;
        invested = 0;

        for (let y = 0; y < years; y++) {
          for (let m = 0; m < 12; m++) {
            total = (total + P) * (1 + r);
            invested += P;
          }
          P *= (1 + step);
        }
        returns = total - invested;
      }

      // Display Labels & Data
      document.getElementById('res-label-1').innerText = activeCalc === 'swp' ? 'Initial Corpus' : 'Invested Amount';
      document.getElementById('res-label-2').innerText = activeCalc === 'swp' ? 'Total Withdrawn' : 'Est. Returns';
      document.getElementById('res-label-3').innerText = activeCalc === 'swp' ? 'Final Balance' : 'Total Future Value';

      document.getElementById('res-val-1').innerText = `₹${Math.round(invested).toLocaleString('en-IN')}`;
      document.getElementById('res-val-2').innerText = `₹${Math.round(returns).toLocaleString('en-IN')}`;
      document.getElementById('res-val-3').innerText = `₹${Math.round(activeCalc === 'swp' ? (total - returns) : total).toLocaleString('en-IN')}`;

      // Update Pie Chart
      const ctx = document.getElementById('calc-chart').getContext('2d');
      if (calcChartInstance) calcChartInstance.destroy();

      calcChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: [document.getElementById('res-label-1').innerText, document.getElementById('res-label-2').innerText],
          datasets: [{
            data: [Math.round(invested), Math.round(returns)],
            backgroundColor: ['#6366f1', '#10b981']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Initialize Tracker View
    renderTracker();
  </script>
</body>
</html>
