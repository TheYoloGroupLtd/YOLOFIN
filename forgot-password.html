<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLOFIN - Reset Password</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #ffffff;
    }
    .glass-input:focus {
      outline: none;
      border-color: #c084fc;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

  <div class="glass-card w-full max-w-md p-8 rounded-2xl border border-purple-500/30 shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Set New Password</h2>
      <p class="text-slate-400 text-sm mt-1">Enter your new secure password below</p>
    </div>

    <div id="reset-error" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-xs text-center"></div>
    <div id="reset-success" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500/50 rounded-lg text-green-200 text-xs text-center"></div>

    <form onsubmit="handleNewPasswordSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs text-purple-300 font-medium mb-1">New Password</label>
        <input type="password" id="new-password" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-900/40 transition duration-200">
        Update Password
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="./index.html" class="text-xs text-purple-400 hover:text-purple-300 underline">Return to Sign In</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xvkqawagfybvweopuphe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_q2BHVLYSqEuoZ3WQdwp1sw__bjUkmwh';

    let verifiedAccessToken = '';

    // Extract the token/OTP from the URL on load and exchange it for a valid session token
    window.addEventListener('DOMContentLoaded', async () => {
      const hash = window.location.hash;
      if (hash && hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        const tokenOrCode = params.get('access_token');

        if (tokenOrCode) {
          try {
            // Directly call Supabase Auth API to verify the recovery token/OTP and get a real JWT
            const response = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY
              },
              body: JSON.stringify({
                type: 'recovery',
                token_hash: tokenOrCode // handles both numeric OTPs and token hashes securely
              })
            });

            const data = await response.json();
            if (data.access_token) {
              verifiedAccessToken = data.access_token;
            } else {
              // Fallback: If it's already a full JWT token
              verifiedAccessToken = tokenOrCode;
            }
          } catch (err) {
            verifiedAccessToken = tokenOrCode;
          }
        }
      }
    });

    async function handleNewPasswordSubmit(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      if (!verifiedAccessToken) {
        // Try extracting again just in case
        const hash = window.location.hash;
        if (hash) {
          const params = new URLSearchParams(hash.substring(1));
          verifiedAccessToken = params.get('access_token');
        }
      }

      if (!verifiedAccessToken) {
        errEl.innerText = 'Auth token missing or expired! Please request a new password reset email.';
        errEl.classList.remove('hidden');
        return;
      }

      try {
        // Direct REST API call to update the user's password using the verified token
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${verifiedAccessToken}`
          },
          body: JSON.stringify({
            password: newPassword
          })
        });

        if (response.ok) {
          succEl.innerText = 'Password updated successfully! Redirecting to sign in...';
          succEl.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = './index.html';
          }, 2000);
        } else {
          const errData = await response.json();
          errEl.innerText = errData.msg || errData.error_description || 'Failed to update password.';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.innerText = 'Network error: ' + err.message;
        errEl.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
