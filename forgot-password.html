<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLOFIN - Reset Password</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client CDN (CRITICAL: Must load before using supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #ffffff;
    }
    .glass-input:focus {
      outline: none;
      border-color: #c084fc;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

  <div class="glass-card w-full max-w-md p-8 rounded-2xl border border-purple-500/30 shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Set New Password</h2>
      <p class="text-slate-400 text-sm mt-1">Enter your new secure password below</p>
    </div>

    <div id="reset-error" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-xs text-center"></div>
    <div id="reset-success" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500/50 rounded-lg text-green-200 text-xs text-center"></div>

    <form onsubmit="handleNewPasswordSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs text-purple-300 font-medium mb-1">New Password</label>
        <input type="password" id="new-password" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-900/40 transition duration-200">
        Update Password
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="./index.html" class="text-xs text-purple-400 hover:text-purple-300 underline">Return to Sign In</a>
    </div>
  </div>

  <script>
    let supabaseClient = null;

    try {
      const SUPABASE_URL = 'https://xvkqawagfybvweopuphe.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_q2BHVLYSqEuoZ3WQdwp1sw__bjUkmwh';
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error('Supabase init failed:', err);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const hash = window.location.hash;
        if (hash && hash.includes('access_token=')) {
          const params = new URLSearchParams(hash.substring(1));
          const accessToken = params.get('access_token');
          const refreshToken = params.get('refresh_token') || '';

          if (accessToken && supabaseClient) {
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
          }
        }
      } catch (err) {
        console.error('Session establishment error:', err);
      }
    });

    async function handleNewPasswordSubmit(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        
        if (!session || sessionError) {
          errEl.innerText = 'Auth session missing or expired! Please request a new link.';
          errEl.classList.remove('hidden');
          return;
        }

        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) {
          errEl.innerText = error.message;
          errEl.classList.remove('hidden');
        } else {
          succEl.innerText = 'Password updated successfully! Redirecting...';
          succEl.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = './index.html';
          }, 2000);
        }
      } catch (err) {
        errEl.innerText = 'An unexpected error occurred: ' + err.message;
        errEl.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
