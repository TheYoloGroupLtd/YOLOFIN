<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLOFIN - Reset Password</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #ffffff;
    }
    .glass-input:focus {
      outline: none;
      border-color: #c084fc;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

  <div class="glass-card w-full max-w-md p-8 rounded-2xl border border-purple-500/30 shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Set New Password</h2>
      <p class="text-slate-400 text-sm mt-1">Enter your new secure password below</p>
    </div>

    <div id="loading-state" class="text-center text-purple-300 text-xs py-4">Validating reset session...</div>

    <div id="reset-error" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-xs text-center"></div>
    <div id="reset-success" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500/50 rounded-lg text-green-200 text-xs text-center"></div>

    <form id="reset-form" onsubmit="handleNewPasswordSubmit(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs text-purple-300 font-medium mb-1">New Password</label>
        <input type="password" id="new-password" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-900/40 transition duration-200">
        Update Password
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="./index.html" class="text-xs text-purple-400 hover:text-purple-300 underline">Return to Sign In</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xvkqawagfybvweopuphe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_q2BHVLYSqEuoZ3WQdwp1sw__bjUkmwh';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener('DOMContentLoaded', async () => {
      const loadingEl = document.getElementById('loading-state');
      const formEl = document.getElementById('reset-form');
      const errEl = document.getElementById('reset-error');

      try {
        // Handle token exchange if URL contains type=recovery or code/access_token
        const hash = window.location.hash;
        const search = window.location.search;

        if (hash.includes('type=recovery') || search.includes('code=')) {
          // Supabase v2 built-in method to parse recovery tokens from URL automatically
          const { data, error } = await supabaseClient.auth.getSession();
          
          if (error || !data.session) {
            // Try explicit OTP verify if hash contains access_token / token_hash
            const params = new URLSearchParams(hash.substring(1));
            const token = params.get('access_token');
            if (token) {
              await supabaseClient.auth.setSession({ access_token: token, refresh_token: '' });
            }
          }
        }

        // Final check for an active user session
        const { data: sessionData } = await supabaseClient.auth.getSession();
        
        if (sessionData.session) {
          loadingEl.classList.add('hidden');
          formEl.classList.remove('hidden');
        } else {
          loadingEl.classList.add('hidden');
          errEl.innerText = 'Invalid or expired recovery link. Please request a new password reset.';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        loadingEl.classList.add('hidden');
        errEl.innerText = 'Initialization error: ' + err.message;
        errEl.classList.remove('hidden');
      }
    });

    async function handleNewPasswordSubmit(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      
      if (error) {
        errEl.innerText = error.message;
        errEl.classList.remove('hidden');
      } else {
        succEl.innerText = 'Password updated successfully! Redirecting to sign in...';
        succEl.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = './index.html';
        }, 2000);
      }
    }
  </script>
</body>
</html>
