<script>
    const SUPABASE_URL = 'https://xvkqawagfybvweopuphe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_q2BHVLYSqEuoZ3WQdwp1sw__bjUkmwh';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Capture tokens from either URL hash or query parameters on load
    window.addEventListener('DOMContentLoaded', async () => {
      const hash = window.location.hash;
      const search = window.location.search;
      
      let accessToken = '';
      let refreshToken = '';

      if (hash && hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        accessToken = params.get('access_token');
        refreshToken = params.get('refresh_token') || '';
      } else if (search && search.includes('access_token=')) {
        const params = new URLSearchParams(search);
        accessToken = params.get('access_token');
        refreshToken = params.get('refresh_token') || '';
      }

      if (accessToken) {
        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (error) {
          document.getElementById('reset-error').innerText = 'Session expired or invalid link. Please request a new reset email.';
          document.getElementById('reset-error').classList.remove('hidden');
        }
      }
    });

    async function handleNewPasswordSubmit(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      // Verify session is active
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        errEl.innerText = 'Auth session missing! Please open the reset link directly from a fresh email.';
        errEl.classList.remove('hidden');
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (error) {
        errEl.innerText = error.message;
        errEl.classList.remove('hidden');
      } else {
        succEl.innerText = 'Password updated successfully! Redirecting to sign in...';
        succEl.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = './index.html';
        }, 2000);
      }
    }
  </script>
