<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLOFIN - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 27, 75, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #ffffff;
    }
    .glass-input:focus {
      outline: none;
      border-color: #c084fc;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

  <div class="glass-card w-full max-w-md p-8 rounded-2xl border border-purple-500/30 shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">Reset Password</h2>
      <p class="text-slate-400 text-sm mt-1">Enter your email, the code from your inbox, and a new password.</p>
    </div>

    <div id="reset-error" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-xs text-center"></div>
    <div id="reset-success" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500/50 rounded-lg text-green-200 text-xs text-center"></div>

    <form onsubmit="handleOtpResetSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs text-purple-300 font-medium mb-1">Email Address</label>
        <input type="email" id="reset-email" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="name@domain.com">
      </div>
      <div>
        <label class="block text-xs text-purple-300 font-medium mb-1">6-Digit Code from Email</label>
        <input type="text" id="reset-otp" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="123456">
      </div>
      <div>
        <label class="block text-xs text-purple-300 font-medium mb-1">New Password</label>
        <input type="password" id="new-password" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-900/40 transition duration-200">
        Update Password
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="./index.html" class="text-xs text-purple-400 hover:text-purple-300 underline">Return to Sign In</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xvkqawagfybvweopuphe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_q2BHVLYSqEuoZ3WQdwp1sw__bjUkmwh';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleOtpResetSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const token = document.getElementById('reset-otp').value;
      const newPassword = document.getElementById('new-password').value;
      
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      // 1. Verify the OTP token type recovery to establish session
      const { error: otpError } = await supabaseClient.auth.verifyOtp({
        email,
        token,
        type: 'recovery'
      });

      if (otpError) {
        errEl.innerText = 'Invalid or expired code: ' + otpError.message;
        errEl.classList.remove('hidden');
        return;
      }

      // 2. Update the password once session is verified
      const { error: updateError } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (updateError) {
        errEl.innerText = updateError.message;
        errEl.classList.remove('hidden');
      } else {
        succEl.innerText = 'Password updated successfully! Redirecting to sign in...';
        succEl.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = './index.html';
        }, 2000);
      }
    }
  </script>
</body>
</html>
